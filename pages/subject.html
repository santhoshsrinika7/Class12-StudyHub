<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Subject - StudyHub</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        .subject-page {
            padding: 60px 7%;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 30px;
            text-decoration: none;
            color: #4f46e5;
            font-weight: bold;
        }

        .subject-header {
            background: white;
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 40px;
            border: 1px solid #e5e7eb;
        }

        .subject-header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subject-header p {
            color: #6b7280;
        }

        .chapter-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .chapter-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            text-decoration: none;
            color: #1f2937;
            transition: 0.2s;
        }

        .chapter-card:hover {
            transform: translateY(-4px);
            border-color: #4f46e5;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .chapter-number {
            color: #4f46e5;
            font-weight: bold;
            font-size: 14px;
        }

        .chapter-card h3 {
            margin: 8px 0;
        }

        .chapter-card p {
            color: #6b7280;
            font-size: 14px;
        }

        .no-chapters {
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            color: #6b7280;
        }

        @media (max-width: 800px) {
            .chapter-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .chapter-grid {
                grid-template-columns: 1fr;
            }

            .subject-header h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            📚 StudyHub
        </div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="../index.html#subjects">Subjects</a>
            <a href="../index.html#resources">Resources</a>
        </nav>

    </header>


    <!-- SUBJECT PAGE -->

    <main class="subject-page">

        <a href="../index.html" class="back-button">
            ← Back to Subjects
        </a>


        <!-- SUBJECT INFORMATION -->

        <section class="subject-header">

            <h1 id="subjectName">
                Subject
            </h1>

            <p>
                Explore chapters, notes, NCERT Q&A, PYQs,
                worksheets and sample papers.
            </p>

        </section>


        <!-- CHAPTERS -->

        <section>

            <div class="section-heading">

                <p>CHAPTERS</p>

                <h2>Choose a Chapter</h2>

                <span>
                    Select a chapter to view its study resources.
                </span>

            </div>


            <div id="chapterGrid" class="chapter-grid">

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>© 2026 Class 12 StudyHub</p>

        <p>Learn • Practice • Improve</p>

    </footer>


    <!-- LOAD DATA -->

    <script src="../data/subjects.js"></script>

    <script>

        // Get subject from URL

        const params = new URLSearchParams(window.location.search);

        const subjectID = params.get("subject");


        // Find subject

        const subject = subjects[subjectID];


        const subjectName = document.getElementById("subjectName");

        const chapterGrid = document.getElementById("chapterGrid");


        // If subject exists

        if (subject) {

            subjectName.textContent =
                subject.icon + " " + subject.name;

            document.title =
                subject.name + " - StudyHub";


            // Add chapters

            if (subject.chapters.length > 0) {

                subject.chapters.forEach(function(chapter, index) {

                    const card = document.createElement("a");

                    card.href =
                        "chapter.html?subject=" +
                        subjectID +
                        "&chapter=" +
                        index;

                    card.className = "chapter-card";


                    card.innerHTML = `
                        <span class="chapter-number">
                            CHAPTER ${String(index + 1).padStart(2, "0")}
                        </span>

                        <h3>
                            ${chapter.name}
                        </h3>

                        <p>
                            Notes, NCERT Q&A, PYQs,
                            worksheets and more.
                        </p>
                    `;


                    chapterGrid.appendChild(card);

                });

            } else {

                chapterGrid.innerHTML = `
                    <div class="no-chapters">
                        <h3>Chapters coming soon</h3>

                        <p>
                            Resources for this subject
                            will be added soon.
                        </p>
                    </div>
                `;

            }

        } else {

            subjectName.textContent =
                "Subject not found";

            chapterGrid.innerHTML = `
                <div class="no-chapters">
                    <h3>Subject not found</h3>

                    <p>
                        Please return to the subjects page.
                    </p>
                </div>
            `;

        }

    </script>

</body>
</html>
